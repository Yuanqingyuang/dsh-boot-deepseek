<!doctype html>
<!--
  The fallback document for scripts/harness/build.mjs — used when the real
  @deepseek-ai/dsh-web-frontend dist page is not available (a fresh clone, or CI).

  It is deliberately BARE and shaped exactly like the dist page, because the page
  builders inject everything else into it by string replacement: the html tag gains
  the platform and theme marks, the head gains the app's tokens, the preload's
  caption probe, the darwin rules and the family bundle's hostile sheet, the root
  element gains the shell's boot card, and the body gains the harness script plus the
  plugin's own rows.

  KEEP THE ANCHORS OUT OF THIS COMMENT. Spelling them out here once made the card
  replacement hit the comment instead of the real element, and the suite failed with
  an empty page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dsh-boot-deepseek harness (fallback document)</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
